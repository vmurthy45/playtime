name: Daily PSN sync

# Captures play time every day whether or not the site is ever opened.
# PSN reports lifetime totals, so per-day history comes from diffing
# consecutive snapshots — which only accumulates while this runs.
on:
  schedule:
    - cron: "0 6 * * *"   # 06:00 UTC daily
  workflow_dispatch: {}    # run on demand from the Actions tab

permissions:
  contents: write

concurrency:
  group: psn-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install psnawp
        run: pip install --quiet psnawp

      - name: Fetch PSN play time
        env:
          PSN_NPSSO: ${{ secrets.PSN_NPSSO }}
        run: python3 tools/psn_sync.py --out data

      - name: Commit updated data
        run: |
          git config user.name "playtime-sync-bot"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/psn_titles.json data/snapshots.json
          if git diff --staged --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Daily PSN sync: $(date -u +%Y-%m-%d)"
            git push
          fi
