name: Daily play-time sync

# Captures play time every day whether or not the site is ever opened.
# Both platforms report lifetime totals, so per-day history comes from diffing
# consecutive snapshots — which only accumulates while this runs.
on:
  schedule:
    # 12:00 UTC = midnight in Auckland (1am while daylight saving is on).
    # Cron cannot follow DST, so the boundary drifts by an hour in summer.
    - cron: "0 12 * * *"
  workflow_dispatch: {}    # run on demand from the Actions tab

permissions:
  contents: write
  issues: write     # so a failed PSN sync can raise an issue and email you

concurrency:
  group: playtime-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install psnawp
        run: pip install --quiet psnawp

      # Each platform is allowed to fail on its own — an expired PSN token
      # should not cost a day of Steam history, and vice versa. A failed step
      # still shows up red on the run.
      - name: Fetch PSN play time
        id: psn
        continue-on-error: true
        env:
          PSN_NPSSO: ${{ secrets.PSN_NPSSO }}
        run: python3 tools/psn_sync.py --out data

      - name: Fetch Steam play time
        continue-on-error: true
        env:
          STEAM_API_KEY: ${{ secrets.STEAM_API_KEY }}
          STEAM_ID: ${{ secrets.STEAM_ID }}
        run: python3 tools/steam_sync.py --out data

      # The npsso cannot be renewed without a login, so the best automation
      # available is telling you the moment it stops working.
      - name: Raise an issue if PSN sync failed
        if: steps.psn.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          title="PSN sync is failing — refresh the npsso token"
          existing=$(gh issue list --state open --search "$title in:title" --json number --jq '.[0].number')
          body=$'The daily PSN sync failed. The usual cause is the npsso token expiring (they last about 60 days).\n\nTo fix:\n1. Log in to PlayStation in a browser.\n2. Open https://ca.account.sony.com/api/v1/ssocookie\n3. Copy the 64-character npsso value.\n4. Update the PSN_NPSSO repository secret.\n5. Re-run the workflow.\n\nSteam is unaffected and keeps syncing.'
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body "Still failing as of $(date -u +%Y-%m-%d)."
          else
            gh issue create --title "$title" --body "$body"
          fi

      - name: Commit updated data
        if: always()
        run: |
          git config user.name "playtime-sync-bot"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/*.json
          if git diff --staged --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Daily sync: $(date -u +%Y-%m-%d)"
            git push
          fi
